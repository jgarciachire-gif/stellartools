<script>
    let ordenesAEliminarIds = [];
    let etiquetasFiltro = [];

    // Función para agregar etiquetas dinámicas (Odoo Style)
    function agregarEtiqueta(tipo, valor) {
        const existe = etiquetasFiltro.some(f => f.tipo === tipo && f.valor.toLowerCase() === valor.toLowerCase());
        if (!existe) {
            etiquetasFiltro.push({ tipo, valor });
            renderizarEtiquetas();
            filtrarOrdenes();
        }
        const dropdown = document.getElementById('dropdown-estatus');
        if (dropdown) dropdown.classList.add('hidden');
    }

    // Función para remover etiquetas
    function removerEtiqueta(index) {
        etiquetasFiltro.splice(index, 1);
        renderizarEtiquetas();
        filtrarOrdenes();
    }

    // Renderiza los badges dentro del contenedor del buscador
    function renderizarEtiquetas() {
        const contenedor = document.getElementById('lista-etiquetas');
        if (!contenedor) return;

        contenedor.innerHTML = '';
        etiquetasFiltro.forEach((f, idx) => {
            const badge = document.createElement('span');
            badge.className = 'inline-flex items-center gap-1 bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-0.5 rounded-md border border-blue-200';
            badge.innerHTML = `
            <span class="text-[10px] text-blue-500 uppercase font-bold">${f.tipo}:</span>
            <span>${f.valor}</span>
            <button type="button" onclick="removerEtiqueta(${idx})" class="hover:text-rose-600 ml-0.5 focus:outline-none">
                <i class="fa-solid fa-xmark text-xs"></i>
            </button>
        `;
            contenedor.appendChild(badge);
        });
    }

    // Función principal de filtrado con rango ampliado de búsqueda
    function filtrarOrdenes() {
        const buscadorOrdenes = document.getElementById('buscador-ordenes');
        const filtroFecha = document.getElementById('filtro-fecha');
        const btnLimpiarFecha = document.getElementById('btn-limpiar-fecha');
        const btnActivarFecha = document.getElementById('btn-activar-fecha');

        const textoInput = buscadorOrdenes ? buscadorOrdenes.value.toLowerCase().trim() : '';
        const fecha = filtroFecha ? filtroFecha.value : '';

        if (btnLimpiarFecha && btnActivarFecha) {
            if (fecha) {
                btnLimpiarFecha.classList.remove('hidden');
                btnActivarFecha.classList.add('text-blue-600');
                btnActivarFecha.classList.remove('text-slate-400');
            } else {
                btnLimpiarFecha.classList.add('hidden');
                btnActivarFecha.classList.remove('text-blue-600');
                btnActivarFecha.classList.add('text-slate-400');
            }
        }

        const detailsElements = document.querySelectorAll('details.group');

        detailsElements.forEach(details => {
            let mostrarMes = false;
            const rows = details.querySelectorAll('.row-orden');

            rows.forEach(row => {
                // Extrae todo el texto visible de la fila completa para búsqueda global
                const contenidoCompletoFila = row.textContent.toLowerCase();

                const celdas = row.querySelectorAll('td');
                if (celdas.length < 9) return;

                const inputEnvio = celdas[4].querySelector('input[type="date"]');
                const inputRecepcion = celdas[5].querySelector('input[type="date"]');

                const fechaEnvio = inputEnvio ? inputEnvio.value : '';
                const fechaRecepcion = inputRecepcion ? inputRecepcion.value : '';

                // 1. Búsqueda por texto libre en cualquier celda o columna
                const coincideTexto = textoInput === '' || contenidoCompletoFila.includes(textoInput);

                // 2. Coincidencia estricta con las etiquetas Odoo aplicadas
                const coincideEtiquetas = etiquetasFiltro.every(f => {
                    const val = f.valor.toLowerCase();
                    return contenidoCompletoFila.includes(val);
                });

                // 3. Coincidencia con el selector de fecha
                const coincideFecha = fecha === "" || fechaEnvio === fecha || fechaRecepcion === fecha;

                if (coincideTexto && coincideEtiquetas && coincideFecha) {
                    row.style.display = '';
                    mostrarMes = true;
                } else {
                    row.style.display = 'none';
                }
            });

            details.style.display = mostrarMes ? '' : 'none';
        });
    }


    // Función para actualizar la fecha de recepción / envío asíncronamente
    async function actualizarFechasAsync(ordenId) {
        const tr = document.querySelector(`tr[data-id="${ordenId}"]`);
        if (!tr) return;

        const inputEnvio = tr.querySelector('input[name="fecha_envio"]');
        const inputRecepcion = tr.querySelector('input[name="fecha_recepcion"]');

        const formData = new FormData();
        formData.append('fecha_envio', inputEnvio ? inputEnvio.value : '');
        formData.append('fecha_recepcion', inputRecepcion ? inputRecepcion.value : '');

        try {
            const response = await fetch(`/ordenes/actualizar/${ordenId}`, {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json'
                },
                body: formData
            });

            const data = await response.json();
            if (data.status === 'ok') {
                // 1. Actualizar Badge de Estatus
                const badge = tr.querySelector('.badge-estatus');
                if (badge) {
                    badge.textContent = data.estatus;
                    if (data.estatus === 'Despacho Recibido' || data.estatus === 'Stock OK') {
                        badge.className = 'badge-estatus px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800';
                    } else {
                        badge.className = 'badge-estatus px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800';
                    }
                }

                // 2. Actualizar Fecha de Vencimiento de Factura
                const celdas = tr.querySelectorAll('td');
                if (celdas[6]) {
                    celdas[6].textContent = data.vencimiento_factura_str || '';
                }

                // 3. Actualizar Alerta de Pago y Punto indicador
                const punto = document.getElementById(`punto-${ordenId}`);
                const textoEstado = document.getElementById(`texto-estado-${ordenId}`);
                const chkPago = tr.querySelector('.chk-finalizada');

                if (punto && textoEstado) {
                    if (data.alerta_text || (chkPago && chkPago.checked)) {
                        punto.classList.remove('hidden');
                    } else {
                        punto.classList.add('hidden');
                    }

                    if (chkPago && chkPago.checked) {
                        textoEstado.textContent = "Pagada";
                        textoEstado.style.color = "#16a34a";
                        punto.className = "w-2.5 h-2.5 rounded-full bg-green-500";
                    } else {
                        textoEstado.textContent = data.alerta_text;
                        textoEstado.style.color = "";
                        punto.className = `w-2.5 h-2.5 rounded-full ${data.alerta_color}`;
                    }
                }

                // 4. Reconfigurar evento del checkbox de pago con los nuevos datos
                if (chkPago) {
                    chkPago.setAttribute('onchange', `cambiarEstadoPago(this, '${ordenId}', '${data.alerta_text}', '${data.alerta_color}')`);
                }

                filtrarOrdenes();
            }
        } catch (error) {
            console.error("Error al actualizar la fecha:", error);
        }
    }

    // Función asíncrona para guardar el estado de pago
    async function cambiarEstadoPago(checkbox, idOrden, textoOriginal, colorOriginal) {
        const textoEstado = document.getElementById('texto-estado-' + idOrden);
        const puntoColor = document.getElementById('punto-' + idOrden);
        const isChecked = checkbox.checked;

        if (isChecked) {
            textoEstado.textContent = "Pagada";
            textoEstado.style.color = "#16a34a";
            puntoColor.className = "w-2.5 h-2.5 rounded-full bg-green-500";
        } else {
            textoEstado.textContent = textoOriginal;
            textoEstado.style.color = "";
            puntoColor.className = "w-2.5 h-2.5 rounded-full " + colorOriginal;
        }

        try {
            await fetch(`/ordenes/pagar/${idOrden}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pagada: isChecked })
            });
            filtrarOrdenes();
        } catch (error) {
            console.error("Error al guardar estado de pago", error);
        }
    }

    // Event Listeners e Inicializaciones
    document.addEventListener('DOMContentLoaded', () => {
        const buscadorOrdenes = document.getElementById('buscador-ordenes');
        const contenedorBuscador = document.getElementById('contenedor-buscador');
        const filtroFecha = document.getElementById('filtro-fecha');
        const btnActivarFecha = document.getElementById('btn-activar-fecha');
        const btnLimpiarFecha = document.getElementById('btn-limpiar-fecha');
        const btnMenuEstatus = document.getElementById('btn-menu-estatus');
        const dropdownEstatus = document.getElementById('dropdown-estatus');

        // Mantiene el foco en el input al hacer clic sobre la caja del buscador
        if (contenedorBuscador && buscadorOrdenes) {
            contenedorBuscador.addEventListener('click', (e) => {
                if (e.target !== buscadorOrdenes && !e.target.closest('button')) {
                    buscadorOrdenes.focus();
                }
            });
        }

        // Convertir búsqueda con Enter en una etiqueta estilo Odoo
        if (buscadorOrdenes) {
            buscadorOrdenes.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && buscadorOrdenes.value.trim() !== '') {
                    e.preventDefault();
                    agregarEtiqueta('Buscar', buscadorOrdenes.value.trim());
                    buscadorOrdenes.value = '';
                } else if (e.key === 'Backspace' && buscadorOrdenes.value === '' && etiquetasFiltro.length > 0) {
                    removerEtiqueta(etiquetasFiltro.length - 1);
                }
            });
            buscadorOrdenes.addEventListener('input', filtrarOrdenes);
        }

        // Control desplegable de estatus
        if (btnMenuEstatus && dropdownEstatus) {
            btnMenuEstatus.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownEstatus.classList.toggle('hidden');
            });
        }

        // Fechas
        if (btnActivarFecha && filtroFecha) {
            btnActivarFecha.addEventListener('click', () => {
                if (typeof filtroFecha.showPicker === 'function') {
                    filtroFecha.showPicker();
                } else {
                    filtroFecha.focus();
                }
            });
        }

        if (filtroFecha) filtroFecha.addEventListener('change', filtrarOrdenes);
        if (btnLimpiarFecha) {
            btnLimpiarFecha.addEventListener('click', () => {
                filtroFecha.value = '';
                filtrarOrdenes();
            });
        }

        // Cierra desplegables al hacer clic fuera
        document.addEventListener('click', () => {
            if (dropdownEstatus) dropdownEstatus.classList.add('hidden');
        });
    });

    // Control de Selección Múltiple
    document.addEventListener('DOMContentLoaded', () => {
        const btnMenuOpciones = document.getElementById('btn-menu-opciones');
        const dropdownOpciones = document.getElementById('dropdown-opciones');
        const btnActivarSeleccion = document.getElementById('btn-activar-seleccion');

        const barraSeleccion = document.getElementById('barra-seleccion');
        const btnCancelarSeleccion = document.getElementById('btn-cancelar-seleccion');
        const btnSeleccionarTodo = document.getElementById('btn-seleccionar-todo');
        const btnEliminarSeleccion = document.getElementById('btn-eliminar-seleccion');
        const contadorSeleccion = document.getElementById('contador-seleccion');

        const colsSeleccion = document.querySelectorAll('.col-seleccion');
        const checkboxes = document.querySelectorAll('.chk-orden');
        const rows = document.querySelectorAll('.row-orden');

        if (btnMenuOpciones) {
            btnMenuOpciones.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownOpciones.classList.toggle('hidden');
            });
        }

        document.addEventListener('click', () => {
            if (dropdownOpciones) dropdownOpciones.classList.add('hidden');
        });

        function actualizarContador() {
            // Unifica el selector a .select-row
            const checkboxesSeleccionados = document.querySelectorAll('.select-row:checked');
            const seleccionados = checkboxesSeleccionados.length;

            if (contadorSeleccion) {
                contadorSeleccion.textContent = `${seleccionados} seleccionado${seleccionados !== 1 ? 's' : ''}`;
            }

            // Sincroniza los IDs globales
            ordenesAEliminarIds = Array.from(checkboxesSeleccionados)
                .map(cb => parseInt(cb.getAttribute('data-id') || cb.value))
                .filter(id => !isNaN(id));

            console.log("[CLIENTE] IDs listos para eliminar:", ordenesAEliminarIds);

            // Controla la habilitación del botón
            const btnEliminar = document.getElementById('btnEliminarMasivo');
            if (btnEliminar) {
                if (seleccionados > 0) {
                    btnEliminar.disabled = false;
                    btnEliminar.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                } else {
                    btnEliminar.disabled = true;
                    btnEliminar.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                }
            }
        }

        function toggleModoSeleccion(activo) {
            if (activo) {
                barraSeleccion.classList.remove('hidden');
                colsSeleccion.forEach(col => col.classList.remove('hidden'));
                btnMenuOpciones.classList.add('hidden');
                dropdownOpciones.classList.add('hidden');
            } else {
                barraSeleccion.classList.add('hidden');
                colsSeleccion.forEach(col => col.classList.add('hidden'));
                btnMenuOpciones.classList.remove('hidden');

                checkboxes.forEach(chk => chk.checked = false);
                rows.forEach(row => row.classList.remove('bg-blue-50/50'));
                actualizarContador();
            }
        }

        if (btnActivarSeleccion) btnActivarSeleccion.addEventListener('click', () => toggleModoSeleccion(true));
        if (btnCancelarSeleccion) btnCancelarSeleccion.addEventListener('click', () => toggleModoSeleccion(false));

        let todoSeleccionado = false;
        if (btnSeleccionarTodo) {
            btnSeleccionarTodo.addEventListener('click', () => {
                todoSeleccionado = !todoSeleccionado;
                checkboxes.forEach(chk => {
                    const tr = chk.closest('tr');
                    if (tr.style.display !== 'none') {
                        chk.checked = todoSeleccionado;
                        if (todoSeleccionado) {
                            tr.classList.add('bg-blue-50/50');
                        } else {
                            tr.classList.remove('bg-blue-50/50');
                        }
                    }
                });
                btnSeleccionarTodo.textContent = todoSeleccionado ? "Desmarcar Todo" : "Seleccionar Todo";
                actualizarContador();
            });
        }

        rows.forEach(row => {
            row.addEventListener('click', (e) => {
                if (!barraSeleccion.classList.contains('hidden')) {
                    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                        const chk = row.querySelector('.chk-orden');
                        if (chk) {
                            chk.checked = !chk.checked;
                            if (chk.checked) row.classList.add('bg-blue-50/50');
                            else row.classList.remove('bg-blue-50/50');
                            actualizarContador();
                        }
                    }
                }
            });
        });

        checkboxes.forEach(chk => {
            chk.addEventListener('change', () => {
                const tr = chk.closest('tr');
                if (chk.checked) tr.classList.add('bg-blue-50/50');
                else tr.classList.remove('bg-blue-50/50');
                actualizarContador();
            });
        });

        if (btnEliminarSeleccion) {
            btnEliminarSeleccion.addEventListener('click', async () => {
                const seleccionados = Array.from(document.querySelectorAll('.chk-orden:checked')).map(chk => parseInt(chk.value));

                if (seleccionados.length === 0) return;

                // Variable global fuera de la función para guardar la lista de elementos seleccionados
                let seleccionadosAEliminar = [];

                // En el evento click de tu botón principal de "Eliminar Selección":
                if (seleccionados.length === 0) return; // Si no hay nada seleccionado, no hace nada

                // Guardamos los seleccionados en la variable global
                seleccionadosAEliminar = seleccionados;

                // Actualizamos el texto en el modal con la cantidad exacta
                document.getElementById('textoConfirmacionEliminar').textContent =
                    `¿Estás seguro de que deseas eliminar ${seleccionados.length} orden(es) de forma permanente?`;

                // Mostramos el modal quitando la clase 'hidden'
                document.getElementById('modalEliminarOrdenes').classList.remove('hidden');
            });
        }
    });

    // Garantiza la apertura del modal con limpieza de clases oscuras
    function abrirModalEliminar(ids) {
        // Normaliza la entrada de IDs
        ordenesAEliminarIds = Array.isArray(ids) ? ids : [ids];

        const cantidad = ordenesAEliminarIds.length;
        const textoModal = document.getElementById('textoConfirmacionEliminar');

        if (textoModal) {
            textoModal.textContent = `¿Estás seguro de que deseas eliminar ${cantidad} orden(es) de forma permanente?`;
        }

        const modal = document.getElementById('modalEliminarOrdenes');
        if (modal) {
            modal.classList.remove('hidden');
        }
    }

    // Procesa la eliminación masiva enviando los IDs por POST al backend
    async function procesarEliminacionModal() {
        console.log("[CLIENTE] IDs guardados a eliminar:", ordenesAEliminarIds);

        if (!ordenesAEliminarIds || ordenesAEliminarIds.length === 0) {
            alert("No hay ordenes seleccionadas para eliminar.");
            cerrarModalEliminar();
            return;
        }

        // Capturar el botón para manipular su estado visual
        const btnConfirmar = document.getElementById('btnConfirmarEliminar') || document.activeElement;
        const contenidoOriginal = btnConfirmar ? btnConfirmar.innerHTML : '';

        try {
            // Activar spinner y deshabilitar interacción
            if (btnConfirmar) {
                btnConfirmar.disabled = true;
                btnConfirmar.classList.add('opacity-75', 'cursor-not-allowed');
                btnConfirmar.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>Eliminando...</span>`;
            }

            const response = await fetch('/ordenes/eliminar_masivo', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ ids: ordenesAEliminarIds })
            });

            console.log("[CLIENTE] Estado de la respuesta HTTP:", response.status);
            const data = await response.json();
            console.log("[CLIENTE] Respuesta recibida del servidor:", data);

            if (response.ok && data.success) {
                window.location.reload(); // Recarga la vista para refrescar la lista
            } else {
                alert("Error del servidor: " + (data.message || "No se pudo eliminar"));
                // Restaurar estado si falla la respuesta
                if (btnConfirmar) {
                    btnConfirmar.disabled = false;
                    btnConfirmar.classList.remove('opacity-75', 'cursor-not-allowed');
                    btnConfirmar.innerHTML = contenidoOriginal;
                }
            }
        } catch (error) {
            console.error("[CLIENTE ERROR] Fallo en la peticion Fetch:", error);
            alert("Error de red o JS: " + error.message);
            // Restaurar estado si hay excepción
            if (btnConfirmar) {
                btnConfirmar.disabled = false;
                btnConfirmar.classList.remove('opacity-75', 'cursor-not-allowed');
                btnConfirmar.innerHTML = contenidoOriginal;
            }
        }
    }

    // Abre el modal de eliminación soportando IDs por argumento o leyendo la tabla
    function abrirModalEliminar(ids = null) {
        if (ids) {
            // Si se pasan IDs manualmente (en array o entero individual)
            ordenesAEliminarIds = Array.isArray(ids) ? ids : [ids];
        } else {
            // Si no se pasan IDs, captura las casillas marcadas en el DOM
            const checkboxes = document.querySelectorAll('input[type="checkbox"][data-id]:checked, input.select-row:checked');
            ordenesAEliminarIds = Array.from(checkboxes)
                .map(cb => parseInt(cb.getAttribute('data-id') || cb.value))
                .filter(id => !isNaN(id));
        }

        // Validación de seguridad antes de mostrar el modal
        if (ordenesAEliminarIds.length === 0) {
            alert("Por favor, selecciona al menos una orden para eliminar.");
            return;
        }

        // Actualiza el contador dinámico en el modal
        const textoModal = document.getElementById('textoConfirmacionEliminar');
        if (textoModal) {
            textoModal.textContent = `¿Estás seguro de que deseas eliminar ${ordenesAEliminarIds.length} orden(es) de forma permanente?`;
        }

        // Muestra el modal quitando la clase de ocultamiento
        const modal = document.getElementById('modalEliminarOrdenes');
        if (modal) modal.classList.remove('hidden');
    }

    // Cierra el modal y restablece el arreglo global de selección
    function cerrarModalEliminar() {
        const modal = document.getElementById('modalEliminarOrdenes');
        if (modal) modal.classList.add('hidden');
        ordenesAEliminarIds = []; // Limpia la lista de IDs a eliminar
    }

    // Controles para Modales de Carga (PDF y XML)
    function abrirModalCargarOC() {
        const dropdown = document.getElementById('dropdown-opciones');
        if (dropdown) dropdown.classList.add('hidden'); // Cierra el menú desplegable
        document.getElementById('modal-cargar-oc').classList.remove('hidden'); // Muestra el modal
    }

    function cerrarModalCargarOC() {
        document.getElementById('modal-cargar-oc').classList.add('hidden'); // Oculta el modal
    }

    function abrirModalCargarXML() {
        const dropdown = document.getElementById('dropdown-opciones');
        if (dropdown) dropdown.classList.add('hidden'); // Cierra el menú desplegable
        document.getElementById('modal-cargar-xml').classList.remove('hidden'); // Muestra el modal
    }

    function cerrarModalCargarXML() {
        document.getElementById('modal-cargar-xml').classList.add('hidden'); // Oculta el modal
    }

    // Procesa la subida con seguimiento de progreso mediante XMLHttpRequest
    function validarYProcesarPDFModal(e) {
        e.preventDefault();

        const input = document.getElementById('input-pdf-modal');
        if (!input.files.length) return;

        let pesoTotal = 0;
        for (let i = 0; i < input.files.length; i++) {
            pesoTotal += input.files[i].size;
        }

        if (pesoTotal > 4 * 1024 * 1024) {
            alert('El peso total de los archivos supera los 4 MB permitidos.');
            return;
        }

        const btn = document.getElementById('btn-procesar-pdf-modal');
        const texto = document.getElementById('btn-texto-pdf-modal');
        const spinner = document.getElementById('btn-spinner-pdf-modal');
        const contenedorProgreso = document.getElementById('contenedor-progreso-pdf');
        const barraProgreso = document.getElementById('barra-progreso-pdf');
        const porcentajeTexto = document.getElementById('porcentaje-progreso');
        const estadoTexto = document.getElementById('texto-estado-progreso');

        texto.innerText = "Subiendo...";
        spinner.classList.remove('hidden');
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        btn.disabled = true;

        if (contenedorProgreso) {
            contenedorProgreso.classList.remove('hidden');
            barraProgreso.style.width = '0%';
            porcentajeTexto.innerText = '0%';
            estadoTexto.innerText = 'Subiendo archivos...';
        }

        const formData = new FormData();
        for (let i = 0; i < input.files.length; i++) {
            formData.append('archivos_pdf', input.files[i]);
        }

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/escanear/procesar', true);
        xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
        xhr.setRequestHeader('Accept', 'application/json');

        // Escucha la carga real del archivo desde el cliente
        xhr.upload.onprogress = function (event) {
            if (event.lengthComputable) {
                const porcentaje = Math.round((event.loaded / event.total) * 100);
                if (barraProgreso && porcentajeTexto) {
                    barraProgreso.style.width = porcentaje + '%';
                    porcentajeTexto.innerText = porcentaje + '%';
                }
                if (porcentaje === 100 && estadoTexto) {
                    estadoTexto.innerText = 'Procesando en servidor...';
                }
            }
        };

        xhr.onload = function () {
            if (xhr.status === 200) {
                try {
                    const data = JSON.parse(xhr.responseText);
                    if (data.success) {
                        cerrarModalCargarOC();
                        renderizarTablaDetalleOC(data.ordenes);
                        document.getElementById('modal-detalle-extraido-oc').classList.remove('hidden');
                    } else {
                        alert('Error al procesar el archivo: ' + (data.mensaje || 'Respuesta no válida'));
                    }
                } catch (err) {
                    alert('La sesión ha expirado o el servidor devolvió una respuesta no válida.');
                }
            } else {
                alert('Error en la comunicación con el servidor. Código: ' + xhr.status);
            }
            restablecerEstadoUI();
        };

        xhr.onerror = function () {
            alert('Ocurrió un error de red al subir los archivos.');
            restablecerEstadoUI();
        };

        function restablecerEstadoUI() {
            texto.innerText = "Procesar PDF(s)";
            spinner.classList.add('hidden');
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            btn.disabled = false;
            if (contenedorProgreso) contenedorProgreso.classList.add('hidden');
        }

        xhr.send(formData);
    }

    // Función para guardar individualmente una orden mediante AJAX
    async function guardarOrdenModal(form) {
        const btnSubmit = form.querySelector('.btn-guardar-individual');
        const formData = new FormData(form);
        const tarjeta = form.closest('.tarjeta-oc');

        try {
            btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
            btnSubmit.disabled = true;

            const response = await fetch('/ordenes/crear', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === 'ok') {
                btnSubmit.innerHTML = '<i class="fa-solid fa-check"></i> Guardado';
                btnSubmit.classList.replace('bg-emerald-600', 'bg-slate-400');
                btnSubmit.classList.replace('hover:bg-emerald-700', 'hover:bg-slate-500');

                tarjeta.classList.add('opacity-50', 'pointer-events-none');
                form.classList.add('guardado-exito');
                return true;
            } else {
                alert('Atención: ' + data.mensaje);
                btnSubmit.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar en Diario';
                btnSubmit.disabled = false;
                return false;
            }
        } catch (error) {
            alert('Error de conexión al guardar.');
            btnSubmit.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar en Diario';
            btnSubmit.disabled = false;
            return false;
        }
    }

    // Asigna event listeners dinámicos a cada formulario y al botón "Guardar Todo"
    function activarEventosFormulariosModal() {
        const forms = document.querySelectorAll('.orden-form-modal');
        const btnGuardarTodo = document.getElementById('btn-guardar-todo-modal');

        forms.forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                await guardarOrdenModal(form);
            });
        });

        if (btnGuardarTodo) {
            // Remover handlers previos para evitar ejecuciones duplicadas
            const nuevoBtn = btnGuardarTodo.cloneNode(true);
            btnGuardarTodo.parentNode.replaceChild(nuevoBtn, btnGuardarTodo);

            nuevoBtn.addEventListener('click', async () => {
                nuevoBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando Todo...';
                nuevoBtn.disabled = true;

                let todosExitosos = true;

                for (const form of forms) {
                    if (!form.classList.contains('guardado-exito')) {
                        const exito = await guardarOrdenModal(form);
                        if (!exito) {
                            todosExitosos = false;
                        }
                    }
                }

                if (todosExitosos) {
                    nuevoBtn.innerHTML = '<i class="fa-solid fa-check-double"></i> Todo Listo';
                    nuevoBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    nuevoBtn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-700');

                    setTimeout(() => {
                        window.location.reload(); // Recargar la página para actualizar la lista de Órdenes de Compra
                    }, 1200);
                } else {
                    nuevoBtn.innerHTML = '<i class="fa-solid fa-layer-group"></i> Guardar Todo';
                    nuevoBtn.disabled = false;
                    alert('Hubo problemas guardando algunas órdenes. Revisa los mensajes.');
                }
            });
        }
    }


    document.getElementById('form-xml-modal').addEventListener('submit', procesarXMLModal);
    // Función asíncrona reescrita para procesar archivos de forma secuencial y real
    async function procesarXMLModal(e) {
        e.preventDefault(); // Prevenir el envío tradicional del formulario

        // 1. Obtener referencias a elementos del modal
        const input = document.getElementById('input-xml-modal');
        const btn = document.getElementById('btn-procesar-xml-modal');
        const texto = document.getElementById('btn-texto-xml-modal');
        const spinner = document.getElementById('btn-spinner-xml-modal');
        const modalDetalle = document.getElementById('modal-detalle-xml-oc');

        const contenedorProgreso = document.getElementById('contenedor-progreso-xml');
        const barraProgreso = document.getElementById('barra-progreso-xml');
        const porcentajeTexto = document.getElementById('porcentaje-progreso-xml');
        const estadoTexto = document.getElementById('texto-estado-progreso-xml');

        // 2. Validar que existan archivos en el input
        if (!input || !input.files || input.files.length === 0) return;
        const archivos = input.files;
        const totalArchivos = archivos.length;

        // 3. Configurar interfaz inicial antes de procesar
        if (texto) texto.innerText = "Procesando...";
        if (spinner) spinner.classList.remove('hidden');
        if (btn) {
            btn.classList.add('opacity-75', 'cursor-default');
            btn.disabled = true;
        }

        if (contenedorProgreso) {
            contenedorProgreso.classList.remove('hidden');
            if (barraProgreso) barraProgreso.style.width = '0%';
            if (porcentajeTexto) porcentajeTexto.innerText = '0%';
            if (estadoTexto) estadoTexto.innerText = `Iniciando (0 de ${totalArchivos})...`;
        }

        let todosProcesados = [];
        let todosNoEncontrados = [];

        // 4. Recorrer y enviar los XML uno a uno para un avance real
        for (let i = 0; i < totalArchivos; i++) {
            const archivoActual = archivos[i];
            const formData = new FormData();
            formData.append('archivos_xml', archivoActual); // Enviar solo 1 archivo por petición

            // Actualizar texto descriptivo del archivo en proceso
            if (estadoTexto) estadoTexto.innerText = `Procesando: ${archivoActual.name} (${i + 1}/${totalArchivos})`;

            try {
                // Petición POST unitaria al backend
                const response = await fetch('/recepciones/procesar-xml', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        if (data.procesados) todosProcesados.push(...data.procesados);
                        if (data.no_encontrados) todosNoEncontrados.push(...data.no_encontrados);
                    }
                } else {
                    todosNoEncontrados.push(archivoActual.name);
                }
            } catch (err) {
                console.error(`Error en ${archivoActual.name}:`, err);
                todosNoEncontrados.push(archivoActual.name);
            }

            // 5. Cálculo exacto del porcentaje completado
            const completados = i + 1;
            const porcentajeReal = Math.round((completados / totalArchivos) * 100);

            // Actualizar barra y número según archivos realmente terminados
            if (barraProgreso) barraProgreso.style.width = `${porcentajeReal}%`;
            if (porcentajeTexto) porcentajeTexto.innerText = `${porcentajeReal}%`;

            // Pausa de 150ms para renderizar suavemente el movimiento de la barra
            await new Promise(resolve => setTimeout(resolve, 150));
        }

        // 6. Finalización y muestra de resultados
        if (estadoTexto) estadoTexto.innerText = '¡Procesamiento finalizado!';

        setTimeout(() => {
            if (typeof cerrarModalCargarXML === 'function') cerrarModalCargarXML();

            // Estructura de datos consolidada para tu tabla de resumen
            const resultadoFinal = {
                success: true,
                procesados: todosProcesados,
                no_encontrados: todosNoEncontrados
            };

            if (typeof renderizarResumenXML === 'function') {
                renderizarResumenXML(resultadoFinal);
            }

            if (modalDetalle) modalDetalle.classList.remove('hidden');

            restablecerEstadoXML();
        }, 400);

        // Función interna para restaurar botones
        function restablecerEstadoXML() {
            if (texto) texto.innerText = "Procesar";
            if (spinner) spinner.classList.add('hidden');
            if (btn) {
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btn.disabled = false;
            }
            if (contenedorProgreso) contenedorProgreso.classList.add('hidden');
        }
    }

    // Función auxiliar para desinfectar texto y prevenir ataques XSS
    function escaparHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // Renderizado corregido con estilos idénticos al módulo "escanear"
    function renderizarResumenXML(data) {
        const bloqueExito = document.getElementById('bloque-xml-exito');
        const tablaExito = document.getElementById('tabla-xml-exito-body');
        const countExito = document.getElementById('count-xml-exito');

        const alertaNoEncontrados = document.getElementById('alerta-xml-no-encontradas');
        const countNoEncontrados = document.getElementById('count-xml-no-encontradas');

        // Obtener la cantidad de OC no procesadas (compatible con conteo directo o longitud de array)
        const totalNoProcesadas = data.total_no_encontrados !== undefined
            ? data.total_no_encontrados
            : (data.no_encontrados ? data.no_encontrados.length : 0);

        // Renderizar la cantidad en la línea inferior si existen no procesadas
        if (alertaNoEncontrados && countNoEncontrados) {
            if (totalNoProcesadas > 0) {
                countNoEncontrados.innerText = `${totalNoProcesadas} orden(es)`; // Asigna el valor numérico
                alertaNoEncontrados.classList.remove('hidden'); // Muestra la barra resumida
            } else {
                alertaNoEncontrados.classList.add('hidden'); // Oculta si todas se actualizaron
            }
        }

        if (tablaExito) {
            tablaExito.innerHTML = '';

            if (data.procesados && data.procesados.length > 0) {
                if (countExito) countExito.innerText = data.procesados.length;

                data.procesados.forEach(row => {
                    tablaExito.innerHTML += `
                    <tr class="hover:bg-slate-50/50 transition-colors text-slate-700">
                        <td class="px-4 py-2.5 font-bold text-slate-800">${escaparHTML(row.numero_orden)}</td>
                        <td class="px-4 py-2.5 font-medium text-blue-800">${escaparHTML(row.proveedor || 'N/A')}</td>
                        <td class="px-4 py-2.5 font-semibold text-slate-700">${escaparHTML(row.tienda_destino || 'N/A')}</td>
                        <td class="px-4 py-2.5 font-medium text-slate-700">${escaparHTML(row.fecha_recepcion)}</td>
                        <td class="px-4 py-2.5 text-center">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                                Recibido
                            </span>
                        </td>
                    </tr>
                `;
                });
                if (bloqueExito) bloqueExito.classList.remove('hidden');
            } else {
                if (bloqueExito) bloqueExito.classList.add('hidden');
            }
        }
    }

    function cerrarModalDetalleXML() {
        const modal = document.getElementById('modal-detalle-xml-oc');
        if (modal) modal.classList.add('hidden');
    }
</script>
<script>
    // Función faltante para cerrar el modal de detalle extraído de PDF
    function cerrarModalDetalleOC() {
        const modal = document.getElementById('modal-detalle-extraido-oc');
        if (modal) modal.classList.add('hidden'); // Oculta el modal de detalle de PDF
    }
    // Función de ordenamiento bidireccional por columna
    const estadoOrden = {};

    function ordenarTablaXML(colIndex) {
        const tbody = document.getElementById('tabla-xml-exito-body');
        if (!tbody) return;

        const filas = Array.from(tbody.querySelectorAll('tr'));

        // Alterna entre ascendente (true) y descendente (false) para cada columna individual
        estadoOrden[colIndex] = !estadoOrden[colIndex];
        const esAscendente = estadoOrden[colIndex];

        filas.sort((a, b) => {
            const valA = a.children[colIndex]?.textContent.trim() || '';
            const valB = b.children[colIndex]?.textContent.trim() || '';

            return esAscendente
                ? valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' })
                : valB.localeCompare(valA, undefined, { numeric: true, sensitivity: 'base' });
        });

        // Vuelve a inyectar las filas en el orden correcto
        filas.forEach(fila => tbody.appendChild(fila));
    }
    // Revisa las casillas marcadas y activa/desactiva el botón de eliminación
    function actualizarEstadoBotonEliminar() {
        const checkboxes = document.querySelectorAll('.select-row:checked');

        // Captura directamente los IDs marcados
        ordenesAEliminarIds = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-id') || cb.value)).filter(id => !isNaN(id));

        console.log("[CLIENTE] IDs seleccionados en tiempo real:", ordenesAEliminarIds);

        // Busca el botón de eliminar por ID o por atributo
        const btnEliminar = document.getElementById('btnEliminarMasivo') || document.querySelector('[data-btn-eliminar]');

        if (btnEliminar) {
            if (ordenesAEliminarIds.length > 0) {
                btnEliminar.disabled = false;
                btnEliminar.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
            } else {
                btnEliminar.disabled = true;
                btnEliminar.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
            }
        }
    }

    // Event listener global para capturar clics en checkbox creados dinámicamente
    document.addEventListener('change', function (e) {
        if (e.target && (e.target.classList.contains('select-row') || e.target.id === 'selectAll')) {
            if (e.target.id === 'selectAll') {
                const filas = document.querySelectorAll('.select-row');
                filas.forEach(cb => cb.checked = e.target.checked);
            }
            actualizarEstadoBotonEliminar();
        }
    });
    // Control de estado de ordenamiento por columna para las tablas de ordenes
    const estadoOrdenTablaPrincipal = {};

    function ordenarTablaPrincipal(th, colIndex, tipo) {
        // Localiza la tabla y el tbody mas cercano a la cabecera clickeada
        const tabla = th.closest('table');
        const tbody = tabla ? tabla.querySelector('tbody') : null;
        if (!tbody) return;

        // Alterna la direccion de ordenamiento (Ascendente / Descendente)
        estadoOrdenTablaPrincipal[colIndex] = !estadoOrdenTablaPrincipal[colIndex];
        const esAsc = estadoOrdenTablaPrincipal[colIndex];

        // Restablece los iconos de todas las columnas de la cabecera
        tabla.querySelectorAll('th i').forEach(icon => {
            icon.className = 'fa-solid fa-sort text-[10px] ml-1 text-slate-400';
        });

        // Actualiza el icono de la columna activa
        const iconoActual = th.querySelector('i');
        if (iconoActual) {
            iconoActual.className = `fa-solid fa-sort-${esAsc ? 'up' : 'down'} text-[10px] ml-1 text-blue-600`;
        }

        // Obtiene las filas principales manteniendo vinculada su fila desplegable de detalle
        const filasPrincipales = Array.from(tbody.querySelectorAll('tr.row-orden'));

        const parejas = filasPrincipales.map(rowMain => {
            const id = rowMain.getAttribute('data-id');
            const rowDetail = tbody.querySelector(`#detalle-${id}`);
            const celda = rowMain.children[colIndex];

            let val = '';
            if (celda) {
                // Lee el valor si la celda contiene un input de fecha o texto normal
                const input = celda.querySelector('input');
                val = input ? input.value : celda.textContent.trim();
            }

            // Normaliza el tipo de dato para una comparacion correcta
            if (tipo === 'numero') {
                // Limpia simbolos de moneda y convierte a float
                val = parseFloat(val.replace(/[^\d.,-]/g, '').replace(/\./g, '').replace(',', '.')) || 0;
            } else if (tipo === 'fecha') {
                val = val ? new Date(val).getTime() : 0;
            } else {
                val = val.toLowerCase();
            }

            return { main: rowMain, detail: rowDetail, val };
        });

        // Ordenar las filas
        parejas.sort((a, b) => {
            if (a.val < b.val) return esAsc ? -1 : 1;
            if (a.val > b.val) return esAsc ? 1 : -1;
            return 0;
        });

        // Reorganiza los nodos dentro del DOM sin perder la fila desplegable
        parejas.forEach(pareja => {
            tbody.appendChild(pareja.main);
            if (pareja.detail) {
                tbody.appendChild(pareja.detail);
            }
        });
    }
    // Alternar visibilidad del detalle desplegable de la Orden de Compra
    function toggleDetalleOC(ordenId) {
        const filaDetalle = document.getElementById(`detalle-${ordenId}`);
        const icono = document.getElementById(`icono-desplegar-${ordenId}`);
        if (filaDetalle) {
            filaDetalle.classList.toggle('hidden');
            if (icono) {
                icono.classList.toggle('rotate-90'); // Rotar flecha indicadora
            }
        }
    }
</script>
