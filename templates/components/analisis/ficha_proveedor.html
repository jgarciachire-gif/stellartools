<!-- Ficha Técnica y Búsqueda de Proveedores -->
<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs mb-6 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 items-end">
        <div
            class="col-span-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-2.5 text-1.5xs pb-1 items-start">

            <!-- Columna 1: Buscador y Etiquetas -->
            <div class="flex flex-col gap-2.5 min-w-0 sm:col-span-2 lg:col-span-1">
                <div class="relative min-w-0" id="combo-proveedor-analisis">
                    <input type="hidden" id="proveedor_id_analisis" value="">
                    <div
                        class="flex items-center gap-1.5 border-b border-slate-300 focus-within:border-blue-500 pb-0.5 transition-colors">
                        <label for="buscar_proveedor_analisis"
                            class="text-1.5xs font-semibold text-slate-700 whitespace-nowrap flex items-center cursor-pointer">
                            <i class="fa-solid fa-truck-field text-amber-600 mr-1"></i>Proveedor:
                        </label>
                        <div class="relative flex-1 min-w-0">
                            <input type="text" id="buscar_proveedor_analisis" placeholder="Escriba para buscar..."
                                autocomplete="off" spellcheck="false" oninput="filtrarProveedoresAnalisis()"
                                onfocus="mostrarOpcionesProvAnalisis()" onkeydown="navegarProveedoresAnalisis(event)"
                                class="w-full bg-transparent border-0 p-0 text-xs text-slate-800 font-semibold focus:ring-0 focus:outline-none pr-5 placeholder:text-slate-400 placeholder:italic autofill:shadow-[0_0_0_1000px_white_inset]">
                            <button type="button" onclick="limpiarProveedorAnalisis()" id="btn-limpiar-prov"
                                class="absolute right-0 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div id="opciones_proveedor_analisis"
                        class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-56 overflow-y-auto z-30">
                        <div onclick="seleccionarProveedorAnalisis('', '-- Seleccionar Proveedor --', '', '', '', '', '')"
                            class="px-4 py-2 text-sm text-slate-400 hover:bg-slate-50 cursor-pointer border-b border-slate-100">
                            -- Seleccionar Proveedor --
                        </div>
                        {% for p in proveedores %}
                        <div onclick="seleccionarProveedorDesdeElemento(this)" data-id="{{ p.id }}"
                            data-nombre="{{ p.nombre or '' }}" data-contacto="{{ p.contacto or '' }}"
                            data-telefono="{{ p.telefono or '' }}"
                            data-dias-credito="{{ p.dias_credito if p.dias_credito is not none else '' }}"
                            data-frecuencia="{{ p.frecuencia_pedidos or p.frecuencia or '' }}"
                            data-etiquetas="{{ p.etiquetas or '' }}"
                            class="opcion-prov-analisis px-4 py-2 text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-600 cursor-pointer">
                            {{ p.nombre }}
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="text-xs font-semibold text-slate-700 whitespace-nowrap flex items-center">
                        <i class="fa-solid fa-tags text-indigo-500 mr-1"></i>Etiquetas:
                    </span>
                    <div id="prov_etiquetas" class="flex flex-wrap gap-1 items-center min-w-0 truncate">
                        <span class="text-xs text-slate-400 italic">Sin proveedor</span>
                    </div>
                </div>
            </div>

            <!-- Columna 2: Contacto y Teléfono -->
            <div class="flex flex-col gap-2.5 min-w-0">
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-semibold text-slate-700 whitespace-nowrap">
                        <i class="fa-solid fa-user text-slate-500 mr-1"></i>Contacto:
                    </span>
                    <input type="text" id="prov_contacto" readonly tabindex="-1" placeholder="-"
                        class="bg-transparent border-0 p-0 text-1.5xs text-slate-800 font-medium focus:ring-0 w-full cursor-default truncate pointer-events-none select-none">
                </div>
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-semibold text-slate-700 whitespace-nowrap">
                        <i class="fa-solid fa-phone text-emerald-600 mr-1"></i>Teléfono:
                    </span>
                    <input type="text" id="prov_telefono" readonly tabindex="-1" placeholder="-"
                        class="bg-transparent border-0 p-0 text-1.5xs text-slate-800 font-medium focus:ring-0 w-full cursor-default truncate pointer-events-none select-none">
                </div>
            </div>

            <!-- Columna 3: Crédito e Inventario -->
            <div class="flex flex-col gap-2.5 min-w-0">
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-semibold text-slate-700 whitespace-nowrap">
                        <i class="fa-solid fa-clock-rotate-left text-sky-600 mr-1"></i>Días de Crédito:
                    </span>
                    <input type="text" id="prov_dias_credito" readonly tabindex="-1" placeholder="-"
                        class="bg-transparent border-0 p-0 text-1.5xs text-slate-800 font-medium focus:ring-0 w-full cursor-default truncate pointer-events-none select-none">
                </div>
                <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-semibold text-slate-700 whitespace-nowrap">
                        <i class="fa-solid fa-calendar-check text-red-400 mr-1"></i>Días Inventario:
                    </span>
                    <input type="text" id="prov_frecuencia" readonly tabindex="-1" placeholder="-"
                        class="bg-transparent border-0 p-0 text-1.5xs text-slate-800 font-medium focus:ring-0 w-full cursor-default truncate pointer-events-none select-none">
                </div>
            </div>

        </div>
    </div>
</div>
