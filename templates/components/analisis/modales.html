<!-- Modal Selección de Tiendas a Exportar -->
<style>
    .tag-tienda-exportar {
        padding: 6px 14px;
        border: 1px solid #007bff;
        background-color: #ffffff;
        color: #007bff;
        border-radius: 20px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        user-select: none;
        transition: all 0.2s ease;
    }

    .tag-tienda-exportar.activa {
        background-color: #007bff;
        color: #ffffff;
    }
</style>

<div id="modal-exportar-tiendas"
    class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm overflow-y-auto p-4">
    <div class="relative z-10 bg-white rounded-xl shadow-2xl w-full max-w-md p-6">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-store text-indigo-600"></i> Seleccionar Tiendas
            </h3>
            <button type="button" id="btn-toggle-todas-tiendas" onclick="toggleTodasLasTiendasExportar()"
                class="px-3 py-1 text-xs font-semibold text-slate-600 bg-slate-50 hover:bg-indigo-100 border border-slate-200 rounded-lg transition-all">
                Todas
            </button>
        </div>
        <p class="text-xs text-slate-500 mb-4">Selecciona las tiendas que deseas incluir para la exportación de datos.
        </p>
        <div id="contenedor-etiquetas-exportar"
            class="flex flex-wrap gap-2 max-h-60 overflow-y-auto p-3 border border-slate-200 rounded-xl bg-slate-50/50 mb-4">
        </div>
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-4">
            <button type="button" onclick="cerrarModalExportarTiendas()"
                class="px-4 py-2.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all">Cancelar</button>
            <button type="button" onclick="confirmarExportacionSeparada()"
                class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-5 rounded-xl transition-all duration-200 text-xs shadow-sm">Aceptar</button>
        </div>
    </div>
</div>

<!-- Modal Buscador de Productos por Descripción (F2) -->
<div id="modal-buscador-productos"
    class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm overflow-y-auto p-4">
    <div class="relative z-10 bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 flex flex-col max-h-[80vh]">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-blue-600"></i> Buscar Producto
            </h3>
            <button type="button" onclick="cerrarModalBuscadorProductos()" class="text-slate-400 hover:text-rose-500">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>
        <div class="relative mb-4">
            <input type="text" id="input-buscar-producto-modal" autocomplete="off" spellcheck="false"
                placeholder="Escriba la descripción y presione Enter..." onkeydown="manejarKeySearchModal(event)"
                class="w-full px-4 py-2 border border-slate-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div id="contenedor-resultados-productos"
            class="flex-1 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100 min-h-[160px] max-h-60">
            <div class="p-4 text-center text-xs text-slate-400 italic">Lista de productos</div>
        </div>
        <div class="flex items-center justify-between pt-4 border-t border-slate-100 mt-4 text-[11px] text-slate-500">
            <span>Navegar: <kbd class="px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-[10px]">↑</kbd>
                <kbd class="px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-[10px]">↓</kbd> | Seleccionar:
                <kbd class="px-1 py-0.5 bg-slate-100 border border-slate-300 rounded text-[10px]">Enter</kbd></span>
            <button type="button" onclick="cerrarModalBuscadorProductos()"
                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg">Cancelar</button>
        </div>
    </div>
</div>
