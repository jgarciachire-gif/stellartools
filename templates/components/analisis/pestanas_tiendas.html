<!-- Navegación por Tienda y Cálculo de Sugeridos -->
<div
    class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="flex items-center gap-2 overflow-x-auto" id="pestanas-tiendas">
        {% for tienda in ['CENTRO', 'NAGUANAGUA', 'ISABELICA', 'CIUDAD ALIANZA', 'GARIBALDI', 'SAN DIEGO'] %}
        <button type="button" onclick="cambiarTiendaPestana('{{ tienda }}')" data-tienda="{{ tienda }}"
            class="btn-pestana-tienda px-4 py-2 rounded-xl text-xs {% if tienda == 'CENTRO' %}font-bold border border-blue-600 bg-blue-600 text-white shadow-xs{% else %}font-semibold border border-slate-200 bg-slate-50 text-slate-600 hover:bg-blue-50 hover:text-blue-600{% endif %} transition">
            <i class="fa-solid fa-store mr-1.5"></i>{{ tienda }}
        </button>
        {% endfor %}
    </div>

    <div class="flex items-center gap-3 shrink-0 ml-auto">
        <div class="flex items-center gap-2">
            <label class="block text-xs font-semibold text-slate-700 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days text-blue-600 mr-1"></i> Días:
            </label>
            <input type="number" id="dias_cobertura" value="7" min="1" step="1"
                oninput="if(this.value < 1 && this.value !== '') this.value = 1; recargarSugeridosEnTabla()"
                class="w-16 px-2 py-1.5 border border-slate-300 rounded-xl text-xs text-center font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50 focus:bg-white transition [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>

        <button type="button" id="btn-calcular-sugerido" onclick="ejecutarCalculoSugeridoConSpinner()"
            class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-semibold rounded-xl text-xs shadow-xs transition flex items-center justify-center gap-2 whitespace-nowrap cursor-pointer disabled:opacity-50 disabled:cursor-default">
            <i class="fa-solid fa-bolt" id="icono-btn-calcular"></i>
            <span id="texto-btn-calcular">Calcular Sugerido</span>
        </button>
    </div>
</div>
