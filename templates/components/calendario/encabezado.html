<!-- Encabezado y Controles de Mes -->
<div
    class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-3">
        <div
            class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-red-400 to-rose-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-red-500/30">
            <i class="fa-solid fa-calendar-days"></i>
        </div>
        <span>Calendario de reposición</span>
    </h1>

    <!-- Controles para navegar entre meses -->
    <div class="flex items-center gap-2">
        <!-- Vuelve inmediatamente al mes actual -->
        <button type="button" @click="irHoy()"
            class="px-3 py-2 rounded-xl text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition-colors">
            Hoy
        </button>

        <!-- Retrocede un mes -->
        <button type="button" @click="mesAnterior()" class="p-2.5 rounded-xl hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-chevron-left text-slate-600"></i>
        </button>

        <!-- Mes actualmente visualizado -->
        <span class="text-lg font-bold text-slate-700 min-w-[160px] text-center" x-text="nombreMesAno">
        </span>

        <!-- Avanza un mes -->
        <button type="button" @click="mesSiguiente()" class="p-2.5 rounded-xl hover:bg-slate-50 transition-colors">
            <i class="fa-solid fa-chevron-right text-slate-600"></i>
        </button>

        <!-- Indicador pequeño de carga -->
        <span x-show="cargandoCalendario" x-cloak class="text-xs text-slate-400" title="Actualizando calendario">
            <i class="fa-solid fa-spinner fa-spin"></i>
        </span>
    </div>
</div>
