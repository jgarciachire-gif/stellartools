<!-- Cuadrícula de Calendario (Columna Derecha) -->
<div class="lg:col-span-6 bg-white rounded-2xl shadow-sm border border-slate-600 overflow-hidden flex flex-col">
    <div
        class="grid grid-cols-7 bg-slate-900 border-b border-slate-600 text-center text-xs font-bold text-slate-100 uppercase tracking-wider py-3">
        <div>Dom</div>
        <div>Lun</div>
        <div>Mar</div>
        <div>Mié</div>
        <div>Jue</div>
        <div>Vie</div>
        <div>Sáb</div>
    </div>

    <div class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-300 bg-slate-200/50 flex-1">
        <template x-for="(dia, index) in diasMes" :key="index">
            <div @click="seleccionarDia(dia.fechaStr)"
                class="min-h-[110px] bg-white p-2 flex flex-col justify-between transition-all cursor-pointer select-none"
                :class="{ 
                    'bg-slate-100/50 opacity-40': !dia.esMesActual, 
                    'ring-2 ring-indigo-600 bg-indigo-50/80 shadow-md z-10': diaSeleccionado === dia.fechaStr,
                    'bg-emerald-100/40': dia.esHoy && diaSeleccionado !== dia.fechaStr 
                }">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold px-2 py-0.5 rounded-full"
                        :class="diaSeleccionado === dia.fechaStr ? 'bg-indigo-600 text-white' : (dia.esHoy ? 'bg-emerald-600 text-white' : 'text-slate-700')"
                        x-text="dia.numero"></span>
                </div>

                <div class="mt-2 flex-1 flex items-center justify-center">
                    <template x-if="obtenerProveedoresAgendadosDia(dia.fechaStr).length > 0">
                        <div
                            class="p-1.5 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1 shadow-2xs w-full">
                            <span
                                x-text="`${obtenerProveedoresAgendadosDia(dia.fechaStr).length} Proveedor(es) en planificación.`"></span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>
