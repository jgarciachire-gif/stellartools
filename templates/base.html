<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StellarTools+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 flex min-h-screen">

    <!-- PANEL LATERAL FLOTANTE / HOVER -->
    <aside class="fixed top-0 left-0 h-screen w-16 hover:w-64 z-50 bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out group shadow-2xl overflow-hidden flex flex-col justify-between">
        <div>
            <!-- Logo / Encabezado -->
            <div class="h-16 flex items-center gap-4 px-4 border-b border-slate-800">
                <i class="fa-solid fa-boxes-packing text-blue-500 text-xl w-8 text-center shrink-0"></i>
                <span class="font-bold text-white text-base opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">
                    StellarTools+
                </span>
            </div>

            <!-- Navegación -->
            <nav class="mt-4 space-y-1 px-2">
                <a href="/" class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-chart-pie text-lg w-8 text-center shrink-0"></i>
                    <span class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Dashboard</span>
                </a>
                
                <a href="/ordenes" class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-receipt text-lg w-8 text-center shrink-0"></i>
                    <span class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Órdenes de Compra</span>
                </a>

                <a href="/escanear" class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-file-pdf text-lg w-8 text-center shrink-0"></i>
                    <span class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Cargar PDF</span>
                </a>

                <a href="/proveedores" class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-truck-field text-lg w-8 text-center shrink-0"></i>
                    <span class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Proveedores</span>
                </a>
            </nav>
        </div>

        <!-- Footer del menú -->
        <div class="p-3 border-t border-slate-800">
            <div class="flex items-center gap-4 text-xs text-slate-500">
                <i class="fa-solid fa-circle-info text-lg w-8 text-center shrink-0"></i>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">v2.4 - Purchase Analyst</span>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL (Con margen fijo a la izquierda para no desplazar nada) -->
    <main class="flex-1 ml-16 p-8 min-h-screen">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
