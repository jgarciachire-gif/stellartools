<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%232563eb' d='M272 96h160c17.7 0 32 14.3 32 32v128H240V128c0-17.7 14.3-32 32-32zm-32 192h224v128c0 17.7-14.3 32-32 32H272c-17.7 0-32-14.3-32-32V288zM48 128H208V256H48V128zM32 64C14.3 64 0 78.3 0 96V416c0 17.7 14.3 32 32 32H208V64H32zm448 0c17.7 0 32 14.3 32 32V416c0 17.7-14.3 32-32 32H240V64H480z'/></svg>">
    <title>StellarTools+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-100 text-slate-800 flex min-h-screen">

    <!-- PANEL LATERAL FLOTANTE / HOVER -->
    <aside
        class="fixed top-0 left-0 h-screen w-16 hover:w-64 z-50 bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out group shadow-2xl overflow-hidden flex flex-col justify-between">
        <div>
            <!-- Logo / Encabezado -->
            <div class="h-16 flex items-center gap-4 px-4 border-b border-slate-800">
                <i class="fa-solid fa-boxes-packing text-blue-500 text-xl w-8 text-center shrink-0"></i>
                <span
                    class="font-bold text-white text-base opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">
                    StellarTools+
                </span>
            </div>

            <!-- Navegación -->
            <nav class="mt-4 space-y-1 px-2">
                <a href="/"
                    class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-chart-pie text-lg w-8 text-center shrink-0"></i>
                    <span
                        class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">General</span>
                </a>

                <a href="/ordenes"
                    class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-receipt text-lg w-8 text-center shrink-0"></i>
                    <span
                        class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Órdenes
                        de Compra</span>
                </a>

                <a href="/proveedores"
                    class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-truck-field text-lg w-8 text-center shrink-0"></i>
                    <span
                        class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Proveedores</span>
                </a>
                <a href="/productos"
                    class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-boxes-stacked text-lg w-8 text-center shrink-0"></i>
                    <span
                        class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Productos</span>
                </a>
                <a href="/perfil"
                    class="flex items-center gap-4 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-colors">
                    <i class="fa-solid fa-user-gear text-lg w-8 text-center shrink-0"></i>
                    <span
                        class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Perfil</span>
                </a>
            </nav>
        </div>

        <!-- Footer del menú -->
        <div class="p-3 border-t border-slate-800 space-y-2">
            <a href="/logout"
                class="flex items-center gap-4 px-3 py-2 rounded-xl text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket text-lg w-8 text-center shrink-0"></i>
                <span
                    class="font-medium opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Cerrar
                    Sesión</span>
            </a>
            <div class="flex items-center gap-4 text-xs text-slate-500">
                <i class="fa-solid fa-circle-info text-lg w-8 text-center shrink-0"></i>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">v
                    2.0.5 - Analisis de Compras</span>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL (Con margen fijo a la izquierda para no desplazar nada) -->
    <main class="flex-1 ml-16 p-8 min-h-screen">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
