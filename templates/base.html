<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%232563eb' d='M272 96h160c17.7 0 32 14.3 32 32v128H240V128c0-17.7 14.3-32 32-32zm-32 192h224v128c0 17.7-14.3 32-32 32H272c-17.7 0-32-14.3-32-32V288zM48 128H208V256H48V128zM32 64C14.3 64 0 78.3 0 96V416c0 17.7 14.3 32 32 32H208V64H32zm448 0c17.7 0 32 14.3 32 32V416c0 17.7-14.3 32-32 32H240V64H480z'/></svg>">
    <title>StellarTools+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

    <header class="h-14 bg-slate-900 text-white flex items-center justify-between px-4 shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a class="font-semibold text-lg tracking-wide flex items-center gap-2 hover:opacity-90 transition-opacity"
                title="Ir al Inicio">
                <i class="fa-solid fa-boxes-packing text-blue-500"></i>
                <span>StellarTools+</span>
            </a>

            <a href="/"
                class="flex items-center gap-2 p-2 hover:bg-slate-800 rounded-lg transition-colors text-slate-300 hover:text-white">
                <svg class="w-5 h-5 text-slate-200 group-hover:text-slate-200 transition-colors" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6">
                    </path>
                </svg>
                <span class="text-sm font-medium hidden sm:inline">Inicio</span>
            </a>

        </div>

        <div class="relative" x-data="{ abierto: false }">
            <button @click="abierto = !abierto" @click.outside="abierto = false"
                class="flex items-center gap-2 p-1.5 hover:bg-slate-800 rounded-lg transition-colors text-slate-300 hover:text-white focus:outline-none">
                <i class="fa-solid fa-circle-user text-xl"></i>
                <span class="text-sm font-medium hidden sm:inline">{{ request.state.perfil.nombre_comprador if
                    request.state.perfil and request.state.perfil.nombre_comprador else 'Mi Cuenta' }}</span>
                <i class="fa-solid fa-chevron-down text-xs transition-transform"
                    :class="abierto ? 'rotate-180' : ''"></i>
            </button>

            <div x-show="abierto" x-cloak
                class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-200 py-1 z-50 text-slate-700">
                <a href="/perfil"
                    class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-user-gear text-slate-500"></i>
                    <span>Ajustes</span>
                </a>
                <div class="border-t border-slate-100 my-1"></div>
                <a href="/logout"
                    class="flex items-center gap-2 px-4 py-2 text-sm text-rose-600 hover:bg-rose-50 transition-colors">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Cerrar sesión</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 max-w-[1800px] w-full mx-auto">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
