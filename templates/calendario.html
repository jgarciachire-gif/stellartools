{% extends "base.html" %}

{% block content %}
<div x-data="calendarioReposicion()" x-init="cargarCalendario()" class="max-w-8xl mx-auto space-y-8">

    <!-- Componente Encabezado -->
    {% include "components/calendario/encabezado.html" %}

    <!-- Layout Principal -->
    <div class="grid grid-cols-1 lg:grid-cols-8 gap-8">
        <!-- Panel Izquierdo -->
        {% include "components/calendario/panel_izquierdo.html" %}

        <!-- Grid Calendario -->
        {% include "components/calendario/grid_calendario.html" %}
    </div>

    <!-- Modal Programar -->
    {% include "components/calendario/modal_programar.html" %}

</div>

<!-- Data embebida necesaria para el JS -->
<div id="usuario-sesion-data"
    data-nombre="{{ request.state.perfil.nombre_comprador if request.state and request.state.perfil and request.state.perfil.nombre_comprador else (request.state.perfil.nombre_completo if request.state and request.state.perfil and request.state.perfil.nombre_completo else 'Usuario Sistema') }}">
</div>

<script id="proveedores-data" type="application/json">
    {{ (proveedores_db or []) | tojson | safe }}
</script>

<!-- Carga del script modular -->
<script src="{{ url_for('static', path='js/calendario.js') }}"></script>
{% endblock %}
