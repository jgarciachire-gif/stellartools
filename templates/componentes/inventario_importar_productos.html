    <div id="modal-importar-inventario" class="hidden fixed inset-0 z-[100]
            bg-slate-900/50
            backdrop-blur-sm
            flex items-center justify-center
            p-4">

        <div class="bg-white w-full max-w-2xl
                max-h-[90vh]
                rounded-2xl
                shadow-2xl
                border border-slate-200
                overflow-hidden
                flex flex-col">

            <!-- CABECERA -->

            <div class="shrink-0
                    px-6 py-4
                    border-b border-slate-200
                    flex items-center justify-between">

                <div>

                    <h2 class="text-lg font-bold text-slate-800">
                        Importar productos
                    </h2>

                    <p class="text-xs text-slate-500 mt-1">
                        Selecciona el proveedor y utiliza los filtros
                        para agregar productos al inventario.
                    </p>

                </div>

                <button type="button" id="btn-cerrar-importador-inventario" class="w-9 h-9 rounded-lg
                           text-slate-400
                           hover:text-slate-700
                           hover:bg-slate-100">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <!-- ESTADO DE CARGA DE CLASIFICACIÓN -->

            <div id="estado-carga-clasificacion-inventario" class="hidden
           px-6 py-3
           border-b border-indigo-100
           bg-indigo-50
           text-indigo-700
           text-sm">

                <div class="flex items-center gap-2">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    <span>
                        Cargando departamentos, grupos, subgrupos y marcas...
                    </span>

                </div>

            </div>


            <!-- CONTENIDO -->

            <div class="flex-1
                    min-h-0
                    overflow-y-auto
                    p-6
                    space-y-5">

                <!-- PROVEEDOR -->

                <div>

                    <label for="buscar-proveedor-inventario" class="block text-xs font-semibold
                              text-slate-700 mb-1.5">

                        Proveedor

                    </label>

                    <div id="combo-proveedor-inventario" class="relative">

                        <!-- ID REAL DEL PROVEEDOR -->

                        <input type="hidden" id="inventario-proveedor" value="">


                        <!-- BUSCADOR -->

                        <div class="relative">

                            <input type="text" id="buscar-proveedor-inventario" placeholder="Escriba para buscar..."
                                autocomplete="off" spellcheck="false" class="w-full
                                      px-4 py-2.5
                                      pr-10
                                      border border-slate-300
                                      rounded-xl
                                      text-sm
                                      bg-white
                                      focus:ring-2
                                      focus:ring-indigo-500/30
                                      focus:border-indigo-500
                                      outline-none">


                            <!-- LIMPIAR -->

                            <button type="button" id="btn-limpiar-proveedor-inventario" class="absolute
                                       right-3
                                       top-1/2
                                       -translate-y-1/2
                                       text-slate-400
                                       hover:text-rose-500
                                       hidden" aria-label="Limpiar proveedor">

                                <i class="fa-solid fa-xmark"></i>

                            </button>

                        </div>


                        <!-- LISTA DESPLEGABLE -->

                        <div id="opciones-proveedor-inventario" class="hidden
                                absolute
                                left-0
                                right-0
                                top-full
                                mt-1
                                bg-white
                                border
                                border-slate-200
                                rounded-xl
                                shadow-lg
                                max-h-56
                                overflow-y-auto
                                z-30">
                        </div>

                    </div>

                </div>


                <!-- FILTROS -->

                <div id="inventario-filtros" class="grid grid-cols-1
                        gap-4">

                    <!-- =========================================================
                     DEPARTAMENTO
                     ========================================================= -->

                    <div class="relative" id="combo-departamento-inventario">

                        <label for="buscar-departamento-inventario" class="block text-xs font-semibold
                                  text-slate-700 mb-1.5">

                            Departamento

                        </label>

                        <input type="hidden" id="inventario-departamento" value="">


                        <div class="relative">

                            <input type="text" id="buscar-departamento-inventario"
                                placeholder="Todos los departamentos..." autocomplete="off" autocorrect="off"
                                autocapitalize="none" spellcheck="false" readonly disabled class="w-full
                                      px-4 py-2.5
                                      pr-10
                                      border border-slate-300
                                      rounded-xl
                                      text-sm
                                      bg-slate-100
                                      focus:ring-2
                                      focus:ring-indigo-500/30
                                      focus:border-indigo-500
                                      outline-none
                                      disabled:cursor-default">


                            <button type="button" id="btn-limpiar-departamento-inventario" class="absolute
                                       right-3
                                       top-1/2
                                       -translate-y-1/2
                                       text-slate-400
                                       hover:text-rose-500">

                                <i class="fa-solid fa-xmark text-xs"></i>

                            </button>

                        </div>


                        <div id="opciones-departamento-inventario" class="hidden
                                absolute
                                left-0
                                right-0
                                top-full
                                mt-1
                                bg-white
                                border border-slate-200
                                rounded-xl
                                shadow-lg
                                max-h-48
                                overflow-y-auto
                                z-30">
                        </div>

                    </div>


                    <!-- =========================================================
                     GRUPO
                     ========================================================= -->

                    <div class="relative" id="combo-grupo-inventario">

                        <label for="buscar-grupo-inventario" class="block text-xs font-semibold
                                  text-slate-700 mb-1.5">

                            Grupo

                        </label>

                        <input type="hidden" id="inventario-grupo" value="">


                        <div class="relative">

                            <input type="text" id="buscar-grupo-inventario" placeholder="Todos los grupos..."
                                autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" readonly
                                disabled class="w-full
                                      px-4 py-2.5
                                      pr-10
                                      border border-slate-300
                                      rounded-xl
                                      text-sm
                                      bg-slate-100
                                      focus:ring-2
                                      focus:ring-indigo-500/30
                                      focus:border-indigo-500
                                      outline-none
                                      disabled:cursor-default">


                            <button type="button" id="btn-limpiar-grupo-inventario" class="absolute
                                       right-3
                                       top-1/2
                                       -translate-y-1/2
                                       text-slate-400
                                       hover:text-rose-500">

                                <i class="fa-solid fa-xmark text-xs"></i>

                            </button>

                        </div>


                        <div id="opciones-grupo-inventario" class="hidden
                                absolute
                                left-0
                                right-0
                                top-full
                                mt-1
                                bg-white
                                border border-slate-200
                                rounded-xl
                                shadow-lg
                                max-h-48
                                overflow-y-auto
                                z-30">
                        </div>

                    </div>


                    <!-- =========================================================
                     SUBGRUPO
                     ========================================================= -->

                    <div class="relative" id="combo-subgrupo-inventario">

                        <label for="buscar-subgrupo-inventario" class="block text-xs font-semibold
                                  text-slate-700 mb-1.5">

                            Subgrupo

                        </label>

                        <input type="hidden" id="inventario-subgrupo" value="">


                        <div class="relative">

                            <input type="text" id="buscar-subgrupo-inventario" placeholder="Todos los subgrupos..."
                                autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" readonly
                                disabled class="w-full
                                      px-4 py-2.5
                                      pr-10
                                      border border-slate-300
                                      rounded-xl
                                      text-sm
                                      bg-slate-100
                                      focus:ring-2
                                      focus:ring-indigo-500/30
                                      focus:border-indigo-500
                                      outline-none
                                      disabled:cursor-default">


                            <button type="button" id="btn-limpiar-subgrupo-inventario" class="absolute
                                       right-3
                                       top-1/2
                                       -translate-y-1/2
                                       text-slate-400
                                       hover:text-rose-500">

                                <i class="fa-solid fa-xmark text-xs"></i>

                            </button>

                        </div>


                        <div id="opciones-subgrupo-inventario" class="hidden
                                absolute
                                left-0
                                right-0
                                top-full
                                mt-1
                                bg-white
                                border border-slate-200
                                rounded-xl
                                shadow-lg
                                max-h-48
                                overflow-y-auto
                                z-30">
                        </div>

                    </div>


                    <!-- =========================================================
                     MARCA
                     ========================================================= -->

                    <div class="relative" id="combo-marca-inventario">

                        <label for="buscar-marca-inventario" class="block text-xs font-semibold
                                  text-slate-700 mb-1.5">

                            Marca

                        </label>

                        <input type="hidden" id="inventario-marca" value="">


                        <div class="relative">

                            <input type="text" id="buscar-marca-inventario" placeholder="Todas las marcas..."
                                autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" class="w-full
                                      px-4 py-2.5
                                      pr-10
                                      border border-slate-300
                                      rounded-xl
                                      text-sm
                                      bg-slate-100
                                      focus:ring-2
                                      focus:ring-indigo-500/30
                                      focus:border-indigo-500
                                      outline-none
                                      disabled:cursor-default">


                            <button type="button" id="btn-limpiar-marca-inventario" class="absolute
                                       right-3
                                       top-1/2
                                       -translate-y-1/2
                                       text-slate-400
                                       hover:text-rose-500">

                                <i class="fa-solid fa-xmark text-xs"></i>

                            </button>

                        </div>


                        <div id="opciones-marca-inventario" class="hidden
                                absolute
                                left-0
                                right-0
                                top-full
                                mt-1
                                bg-white
                                border border-slate-200
                                rounded-xl
                                shadow-lg
                                max-h-48
                                overflow-y-auto
                                z-30">
                        </div>

                    </div>

                </div>


                <!-- RESULTADO -->

                <div id="inventario-importacion-info" class="hidden
                        rounded-xl
                        border border-indigo-100
                        bg-indigo-50
                        px-4 py-3
                        text-sm
                        text-indigo-700">

                </div>

            </div>


            <!-- FOOTER -->

            <div class="shrink-0
                    px-6 py-4
                    border-t border-slate-200
                    flex flex-col-reverse
                    sm:flex-row
                    sm:justify-end
                    gap-3">

                <button type="button" id="btn-cancelar-importador-inventario" class="w-full
                           sm:w-auto
                           px-4 py-2.5
                           rounded-xl
                           border border-slate-300
                           text-slate-700
                           font-semibold
                           hover:bg-slate-50">

                    Cancelar

                </button>


                <button type="button" id="btn-ejecutar-importacion-inventario" class="w-full
                           sm:w-auto
                           px-4 py-2.5
                           rounded-xl
                           bg-indigo-600
                           hover:bg-indigo-700
                           text-white
                           font-semibold">

                    <i class="fa-solid fa-download mr-1"></i>

                    Importar productos

                </button>

            </div>

        </div>

    </div>
