{% macro selector_archivo(id, accept, ayuda, nombre='archivo', descripcion_id='') %}
<label for="{{ id }}" class="mb-2 block text-sm font-medium text-gray-700">Archivo de productos</label>
<input type="file" id="{{ id }}" name="{{ nombre }}" accept="{{ accept }}"
    aria-describedby="{{ descripcion_id }}"
    class="w-full rounded-lg border p-1 text-sm text-slate-500 file:mr-4 file:rounded-md file:border-0 file:bg-indigo-50 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-indigo-700 hover:file:bg-indigo-100">
<p id="{{ descripcion_id }}" class="mt-3 text-xs text-slate-500">{{ ayuda }}</p>
{% endmacro %}
