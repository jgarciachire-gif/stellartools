<div class="static sm:relative"
    data-usuario-notificaciones="{{ request.state.user.id if request.state.user else (request.state.perfil.usuario_id if request.state.perfil else '') }}"
    x-data="notificacionesHeader($el.dataset.usuarioNotificaciones)" @click.outside="abierto = false"
    @focusout="if (!$el.contains($event.relatedTarget)) abierto = false" @keydown.stop
    @keydown.escape.prevent.stop="abierto = false; $refs.campana.focus()">
    <button type="button" x-ref="campana" @click="alternar()" title="Notificaciones"
        aria-controls="panel-notificaciones-header" :aria-expanded="abierto"
        :aria-label="total ? `Notificaciones: ${total} ${total === 1 ? 'proveedor' : 'proveedores'} con avisos de reposición` : 'Notificaciones'"
        class="relative flex h-9 w-9 items-center justify-center rounded-lg text-white transition-colors hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-emerald-200">
        <i class="fa-regular fa-bell text-xl" aria-hidden="true"></i>
        <span x-show="total > 0" x-cloak x-text="total > 99 ? '99+' : total"
            class="absolute -right-1 -top-1 min-w-4 rounded-full bg-rose-500 px-1 text-center text-[10px] font-semibold leading-4 text-white"
            aria-hidden="true"></span>
    </button>

    <section id="panel-notificaciones-header" x-show="abierto" x-cloak x-transition.opacity.duration.150ms
        aria-labelledby="titulo-notificaciones-header" :aria-busy="cargando"
        class="absolute right-4 top-full z-[60] mt-2 w-[min(420px,calc(100vw-2rem))] overflow-hidden rounded-2xl border border-slate-200 bg-white text-slate-700 shadow-xl sm:right-0">
        <div class="flex items-center justify-between gap-3 border-b border-slate-100 px-4 py-3">
            <div>
                <h2 id="titulo-notificaciones-header" class="text-sm font-semibold text-slate-800">Notificaciones</h2>
                <p class="mt-0.5 text-xs text-slate-500">Reposición de inventario</p>
            </div>
            <button type="button" @click="cargar(true)" :disabled="cargando" title="Actualizar notificaciones"
                aria-label="Actualizar notificaciones"
                class="rounded-lg p-2 text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-700 disabled:opacity-40">
                <i class="fa-solid fa-rotate-right" :class="cargando && 'animate-spin'" aria-hidden="true"></i>
            </button>
        </div>

        <div class="max-h-[min(420px,60vh)] overflow-y-auto overscroll-contain">
            <p x-show="cargando" role="status" class="flex items-center gap-2 px-4 py-6 text-sm text-slate-500">
                <span class="h-4 w-4 animate-spin rounded-full border-2 border-slate-200 border-t-indigo-600" aria-hidden="true"></span>
                Cargando notificaciones…
            </p>
            <p x-show="!cargando && error" x-text="error" role="alert" class="px-4 py-5 text-sm text-rose-600"></p>
            <p x-show="!cargando && !error && !notificaciones.length" class="px-4 py-6 text-center text-sm text-slate-500">
                No tienes avisos de reposición pendientes.
            </p>

            <div x-show="!cargando && !error" class="divide-y divide-slate-100">
                <template x-for="aviso in notificaciones" :key="aviso.proveedor">
                    <article class="px-4 py-3">
                        <div class="flex items-start justify-between gap-3">
                            <h3 class="text-sm font-semibold text-slate-800" x-text="aviso.proveedor"></h3>
                            <button type="button" @click="descartar(aviso)" :disabled="!aviso.version_estado"
                                :aria-label="'Descartar alerta de ' + aviso.proveedor" title="Descartar alerta del proveedor"
                                class="shrink-0 rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-rose-50 hover:text-rose-600 disabled:opacity-40">
                                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                            </button>
                        </div>
                        <p class="mt-0.5 text-xs text-slate-500">Estatus del inventario</p>
                        <ul class="mt-2 space-y-2">
                            <template x-for="(detalle, indice) in aviso.tiendas" :key="indice">
                                <li class="rounded-xl bg-slate-50 px-3 py-2">
                                    <div class="flex flex-wrap items-center justify-between gap-1.5">
                                        <span class="text-xs font-semibold text-slate-700" x-text="detalle.tienda"></span>
                                        <span class="rounded-md px-2 py-0.5 text-[11px] font-medium"
                                            :class="detalle.estatus === 'Reponer inventario' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'"
                                            x-text="detalle.estatus"></span>
                                    </div>
                                    <p class="mt-1 text-xs text-slate-500">Días inventario:
                                        <span class="font-medium text-slate-700" x-text="detalle.dias_inventario"></span>
                                    </p>
                                    <p x-show="detalle.mostrar_grupos" class="mt-1 text-[11px] text-slate-400"
                                        x-text="'Grupo: ' + detalle.grupos.join(', ')"></p>
                                </li>
                            </template>
                        </ul>
                    </article>
                </template>
            </div>
        </div>
        <a href="/dashboard" class="block border-t border-slate-100 px-4 py-3 text-center text-xs font-medium text-indigo-600 transition-colors hover:bg-slate-50">
            Ver reposición de inventario
        </a>
    </section>
</div>
